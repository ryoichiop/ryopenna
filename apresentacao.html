<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>O Desafio da Execução · Ryo Penna · CEO Forum 2026</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@4.6.1/dist/reset.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@4.6.1/dist/reveal.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=League+Gothic&family=Inter:wght@400;500;600&display=block">
<style>
  :root {
    --bg-navy: #191C24;
  }
  html, body {
    background: var(--bg-navy);
    margin: 0;
    padding: 0;
    font-family: 'Inter', sans-serif;
  }
  .reveal {
    background: var(--bg-navy);
  }
  .reveal .slides {
    background: var(--bg-navy);
  }
  /* Tirar os estilos padrão do Reveal que interferem com nossos slides. */
  .reveal .slides section {
    padding: 0 !important;
    height: 100% !important;
    width: 100% !important;
    text-align: initial;
    background: var(--bg-navy);
  }
  .reveal iframe.slide-frame {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    background: var(--bg-navy);
  }
  /* Ocultar controles por padrão (aparecem ao hover). */
  .reveal .controls {
    color: rgba(245, 240, 235, 0.35);
  }
  .reveal .progress {
    color: rgba(245, 240, 235, 0.4);
    height: 2px;
  }
</style>
</head>
<body>
<div class="reveal">
  <div class="slides">
    <section data-background="#191C24">
      <iframe class="slide-frame" src="slides/01-capa.html"></iframe>
    </section>
    <section data-background="#191C24">
      <iframe class="slide-frame" src="slides/02-throughline.html"></iframe>
    </section>
    <section data-background="#191C24" data-autoplay="true">
      <iframe class="slide-frame" src="slides/03-equacao.html" data-src="slides/03-equacao.html"></iframe>
    </section>
    <section data-background="#191C24">
      <iframe class="slide-frame" src="slides/04-citacao-charan.html"></iframe>
    </section>
    <section data-background="#191C24">
      <iframe class="slide-frame" src="slides/05-card-final.html"></iframe>
    </section>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/reveal.js@4.6.1/dist/reveal.js"></script>
<script>
  // Reveal 4.x inicialização.
  Reveal.initialize({
    width: 3840,
    height: 2160,
    margin: 0,
    minScale: 0.1,
    maxScale: 2.0,
    hash: true,
    controls: true,
    progress: true,
    center: false,
    transition: 'none',
    backgroundTransition: 'none',
    keyboard: {
      // F já abre fullscreen no Reveal por padrão; setas navegam.
      // R recarrega iframe atual (reinicia animação do slide 03).
      82: () => {
        const slide = Reveal.getCurrentSlide();
        const iframe = slide && slide.querySelector('iframe.slide-frame');
        if (iframe) {
          const src = iframe.src;
          iframe.src = '';
          iframe.src = src;
        }
      }
    }
  });

  // Quando o slide 03 (equação) é revelado, recarrega o iframe para disparar autoplay.
  Reveal.on('slidechanged', (event) => {
    const iframe = event.currentSlide.querySelector('iframe.slide-frame');
    if (!iframe) return;
    if (iframe.src.indexOf('03-equacao') !== -1) {
      // Força reload para reiniciar autoplay da animação.
      const src = iframe.src;
      iframe.src = '';
      iframe.src = src;
    }
  });
</script>
</body>
</html>
